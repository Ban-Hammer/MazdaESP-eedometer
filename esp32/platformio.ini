; MX-5 ND digital speedometer - single ESP32 build
; Board: HiLetgo ESP32-DevKitC-32 (classic ESP32-WROOM-32)
;
;   pio run -t upload      ; flash firmware over USB
;   pio run -t uploadfs    ; flash data/ (fonts) to LittleFS  (required once)
;
; TFT_eSPI is configured entirely through build_flags below, so there is no
; User_Setup.h to lose when the library updates.

[env:esp32dev]
platform = espressif32@6.9.0      ; arduino-esp32 2.0.17 (TFT_eSPI is happiest here)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv   ; two 1.25MB app slots (OTA) + ~1.4MB LittleFS

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ; bodmer/TJpg_Decoder@^1.1.0   ; only needed if the boot splash is re-enabled

build_flags =
  ; ---- TFT_eSPI: generic 240x240 ST7789 on VSPI -------------------------------
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MISO=-1
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=19
  -DTFT_RST=21
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  ; ---- Project options --------------------------------------------------------
  ; 1 = listen-only (never ACKs; use in the car). 0 = normal mode (bench replay
  ; rigs such as SavvyCAN on another ESP32 need someone to ACK frames).
  -DCAN_LISTEN_ONLY=1
build_src_filter = +<*> -<logger.cpp>

; CAN capture build for finding frames (RPM, gear, clutch...). Same wiring, no display.
;   pio run -e logger -t upload
[env:logger]
extends = env:esp32dev
build_src_filter = -<*> +<logger.cpp>
monitor_speed = 921600
